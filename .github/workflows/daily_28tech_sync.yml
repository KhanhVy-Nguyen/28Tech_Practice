name: Daily 28tech Sync

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-28tech-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Configure commit author
        run: |
          git config user.name "KhanhVy"
          git config user.email "110233400+KhanhVy-Nguyen@users.noreply.github.com"
      - name: Crawl accepted submissions
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: python crawl_and_commit.py
      - name: Push saved solutions
        if: ${{ !cancelled() }}
        run: git push origin HEAD:${{ github.event.repository.default_branch }}
